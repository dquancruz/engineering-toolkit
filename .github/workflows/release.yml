name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history and tags, needed for the release notes
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - name: Check that the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package.json version v${version}" >&2
            exit 1
          fi
      - name: Pack
        run: npm pack
      - name: Create GitHub Release with the tarball
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Notes come from the commits since the previous tag; without one, GitHub generates them.
          if previous="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null)"; then
            notes="${RUNNER_TEMP}/notes.md"
            node dist/cli.js --lang en changelog "${previous}" "${GITHUB_REF_NAME}" --stdout > "${notes}"
            printf '\n**Full changelog**: %s/%s/compare/%s...%s\n' \
              "${GITHUB_SERVER_URL}" "${GITHUB_REPOSITORY}" "${previous}" "${GITHUB_REF_NAME}" >> "${notes}"
            notes_args=(--notes-file "${notes}")
          else
            notes_args=(--generate-notes)
          fi
          gh release create "${GITHUB_REF_NAME}" ./*.tgz --title "${GITHUB_REF_NAME}" "${notes_args[@]}" --verify-tag

name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm test
      - run: npm audit --audit-level=moderate

  # The agent guards and the git, .env, legacy and rebuild commands run on the developer's machine, so they are tested
  # on Windows and macOS too. The rest of the suite still assumes Linux (see ROADMAP, "Future ideas").
  portability:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx vitest run test/agent test/branch test/changelog test/env test/legacy test/rebuild test/sources-compat.test.ts

  # The web app is a separate package: its own lockfile, unit tests, build checks and browser tests.
  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm run test:build # reviewed network scan and size budget
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run test:e2e # behaviour, privacy and accessibility
      - run: npm audit --audit-level=moderate

